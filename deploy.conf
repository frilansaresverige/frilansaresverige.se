# For deploy-app (the automation repository's bin/deploy-app, on PATH), which
# deploy.sh runs. The container's configuration and secrets are in the
# automation repository: ansible/host_vars/gredelin/apps.yml (frilansaresverige)
# and its vault.
APP=frilansaresverige
IMAGE=frilansaresverige-website
HOST=gredelin
TEST_CMD="npm test"
# Baked into the statically rendered pages, so it's needed at build time; taken
# from the environment.
BUILD_ARGS=(--build-arg "GOOGLE_ANALYTICS_ID=${GOOGLE_ANALYTICS_ID:-}")
